name: Performance experiments
on:
  pull_request:
    paths:
      - 'patches/performance/**'
      - 'patches/opus_swap/test_tags.py'
      - '.github/workflows/performance-experiments.yml'
permissions:
  contents: read
jobs:
  output-parity:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned emulator tools
        run: python -m pip install capstone==5.0.7 keystone-engine==0.9.2 unicorn==2.1.4
      - name: Install hash-pinned LLVM reference compiler
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'llvm-mingw-reference.zip'
          $target = Join-Path $env:RUNNER_TEMP 'llvm-mingw-reference'
          if (Test-Path -LiteralPath $target) { throw 'Reference directory already exists' }
          Invoke-WebRequest 'https://github.com/mstorsjo/llvm-mingw/releases/download/20260407/llvm-mingw-20260407-ucrt-x86_64.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLower() -ne '3fc6e54b5f1102089d4d37095ba49f7b24e22290da78178b514a86b3126c6d9e') { throw 'LLVM archive hash mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $target
          $compiler = @(Get-ChildItem -LiteralPath $target -Filter clang.exe -Recurse)
          if ($compiler.Count -ne 1) { throw 'Expected exactly one reference compiler' }
          $compiler[0].DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Profile native non-rendering paths
        run: python patches/performance/profile_nonrender.py
      - name: Compare complete metadata records
        run: python patches/performance/test_metadata_ascii.py
      - name: Compare full framebuffer and display context
        run: python patches/performance/test_fill_unroll.py
