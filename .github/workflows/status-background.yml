name: Status background reproduction
on:
  pull_request:
    paths:
      - 'patches/status_bar/**'
      - '.github/workflows/status-background.yml'
permissions:
  contents: read
jobs:
  native-resource-census:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned emulator tools
        run: python -m pip install capstone==5.0.7 keystone-engine==0.9.2 unicorn==2.1.4
      - name: Pin native negative-control pixel counts
        run: python patches/status_bar/test_status_resource_draw.py
