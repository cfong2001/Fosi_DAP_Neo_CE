name: Firmware build and release

# Rebuilds every image from source on each change, runs the full framework
# verifier, and checks the committed release/ images against the rebuild.
# Pushing a tag v* publishes a GitHub release with the same files.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, verify and pin images
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned Python tools
        run: python -m pip install capstone==5.0.7 keystone-engine==0.9.2 unicorn==2.1.4 pillow==11.3.0

      - name: Install reference ARM toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libisl23 libmpc3 libmpfr6 libgmp10
          bash ci/install_reference_toolchain.sh "$RUNNER_TEMP/ce-arm"
          echo "$RUNNER_TEMP/ce-arm/usr/bin" >> "$GITHUB_PATH"

      - name: Fetch hash-pinned decoder inputs
        run: |
          bash ci/fetch_decoder_inputs.sh "$RUNNER_TEMP/ecpatch"
          echo "FOSI_ECPATCH_DIR=$RUNNER_TEMP/ecpatch" >> "$GITHUB_ENV"

      - name: Run the framework verifier (15 checks)
        run: python patches/framework/verify.py

      - name: Stock Bluetooth UART set-up under emulation
        run: python tools/emu_bt_uart.py

      - name: DAC filter selection under emulation
        run: python patches/dac_filter/test_dac_filter.py

      - name: Bluetooth auto-off supervisor under emulation
        run: python patches/bt_auto_off/test_bt_auto_off.py

      - name: EQ preset selector and fit under emulation
        run: python patches/eq_presets/test_eq_presets.py

      - name: Track-change transition rig (stock, CE and mutants)
        run: python patches/gapless/rig/test_transition.py

      - name: Antialiased screen art and keyed progress knob
        run: python patches/antialias/test_screens.py

      - name: Player time typography, marquee timing and labels
        run: |
          python patches/player_ui/build_typography.py
          git diff --exit-code -- patches/player_ui
          python patches/player_ui/test_typography.py
          python patches/player_ui/build_metadata.py
          git diff --exit-code -- patches/player_ui
          python patches/player_ui/test_metadata.py

      - name: Redrawn Font B glyphs
        run: python patches/antialias/test_font.py

      - name: Module 0 dead-code census and emulation coverage gate
        run: python patches/space/run_coverage.py

      - name: Simulator data matches the emulated painter
        run: |
          python tools/gen_sim_data.py
          git diff --exit-code -- docs/sim-data.mjs tests/fixtures/sim-painter.json

      - name: Build the release set
        run: bash ci/build_release.sh "$RUNNER_TEMP/dist"

      - name: Committed release images match the rebuild
        run: |
          cd release
          sha256sum --check --strict SHA256SUMS
          for f in DP3_V137_CE.img DP3_V137_CE_minimal.img DP3_V137_CE_recovery.img \
                   DP3_V137_CE.img.report.json DP3_V137_CE_minimal.img.report.json; do
            cmp "$f" "$RUNNER_TEMP/dist/$f"
          done

      - name: Full-build emulation suites
        run: |
          cp "$RUNNER_TEMP/dist/DP3_V137_CE.img" \
            patches/full/out/DP3_V137_CE_full.img
          cd patches/full/build/tests
          python test_playlist_lifecycle.py
          python emu_resolver_full.py --image ../../out/DP3_V137_CE_full.img
          python audit_playlist_start.py
          python test_theater_full.py
          python test_theater_noart.py
          python test_transport_ground.py
          python emu_bt_tail_full.py

      - name: Focus mode on the full build
        run: |
          cd patches/focus_mode
          FOCUS_FULL_IMAGE="$RUNNER_TEMP/dist/DP3_V137_CE.img" python test_focus_mode.py

      - name: Power profile item on the full build
        run: |
          cd patches/power/profiles
          python build_profiles.py
          git diff --exit-code -- . ../../full/patches
          PROFILES_FULL_IMAGE="$RUNNER_TEMP/dist/DP3_V137_CE.img" python test_profiles.py

      - name: Standalone theater and focus variants
        run: |
          (cd patches/theater/build && python build_theater.py && python test_theater_lifecycle.py)
          (cd patches/focus_mode && python build_focus.py && python test_focus_mode.py)
          git diff --exit-code -- patches/theater/build patches/focus_mode

      - name: Upload release set
        uses: actions/upload-artifact@v4
        with:
          name: dap-neo-ce-${{ github.sha }}
          path: ${{ runner.temp }}/dist
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: dap-neo-ce-${{ github.sha }}
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check --strict SHA256SUMS
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "DAP Neo CE $TAG" --notes-file ../release/RELEASE_NOTES.md \
            DP3_V137_CE.img DP3_V137_CE.img.report.json \
            DP3_V137_CE_minimal.img DP3_V137_CE_minimal.img.report.json \
            DP3_V137_CE_recovery.img SHA256SUMS
